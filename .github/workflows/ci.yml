name: Tests and distributions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10', dependencies: minimum}
          - {os: ubuntu-latest, python: '3.11', dependencies: current}
          - {os: ubuntu-latest, python: '3.12', dependencies: current}
          - {os: ubuntu-latest, python: '3.13', dependencies: current}
          - {os: windows-latest, python: '3.12', dependencies: current}
          - {os: macos-latest, python: '3.12', dependencies: current}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - if: matrix.dependencies == 'minimum'
        run: python -m pip install -e '.[dev]' -c ci/constraints-min.txt
      - if: matrix.dependencies == 'current'
        run: python -m pip install -e '.[dev]'
      - run: python ci/check_version.py
      - run: python -m pytest -q
      - name: Check installed imports without optional backends
        run: python ci/installed_smoke.py

  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e '.[dev]'
      - run: .venv/bin/python -m pyright

  optional-backends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [jax, deep-learning]
    env:
      CUDA_VISIBLE_DEVICES: '-1'
      TF_CPP_MIN_LOG_LEVEL: '3'
      OMP_NUM_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - if: matrix.backend == 'jax'
        run: python -m pip install '.[jax]'
      - if: matrix.backend == 'deep-learning'
        run: python -m pip install -r requirements-deep-learning.txt
      - run: python -m pytest -q

  validation-workflows:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Scientific validation smoke study
        run: python benchmarks/simulation.py --quick --output '${{ runner.temp }}/scientific-smoke.json'
      - name: Runtime and memory smoke study
        run: python benchmarks/performance.py --quick --output '${{ runner.temp }}/performance-smoke.json'
      - name: Real-data workflow
        run: python examples/gbsg2_analysis.py --quick --output '${{ runner.temp }}/gbsg2-smoke.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            ${{ runner.temp }}/scientific-smoke.json
            ${{ runner.temp }}/performance-smoke.json
            ${{ runner.temp }}/gbsg2-smoke.json

  distributions:
    uses: ./.github/workflows/release-check.yml
