name: Release checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python ci/check_version.py
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install and smoke-test each distribution away from the checkout
        shell: bash
        run: |
          for artifact in "$GITHUB_WORKSPACE"/dist/*; do
            target=$(mktemp -d)
            python -m venv "$target/venv"
            "$target/venv/bin/python" -m pip install "$artifact"
            cp ci/installed_smoke.py "$target/smoke.py"
            (cd "$target" && venv/bin/python -I smoke.py)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
