[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skcure"
version = "0.1.0.dev0"
description = "Cure models with the scikit-survival estimator API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn>=1.6",
    "scikit-survival>=0.25",
    "jax",
]

[project.optional-dependencies]
deep-learning = [
    "tensorflow>=2.16",
    "deepcure @ git+https://github.com/vhmedina/deepcure.git@4cb1dd2ba0a603c9b93c8584620b1488df12621b",
    "numba",
    "pandas",
]
dev = [
    "pytest>=8",
    "build>=1",
]

[tool.setuptools.packages.find]
include = ["skcure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
